<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AITU Smart Gym</title>
<style>
:root{--ink:#14202b;--mut:#5b6670;--bg:#f4f6f3;--card:#fff;--line:#d9ddd8;--ac:#0b7a5c;--ac2:#e8f4ef;--bad:#b3261e;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
header h1{font-size:20px;margin:0}nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{background:transparent;color:#fff;border:1px solid #ffffff55;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:15px}
nav button.on{background:var(--ac);border-color:var(--ac)}.who{font-size:14px;color:#cfd8d3}
main{max-width:980px;margin:0 auto;padding:20px}h2{margin:0 0 12px;font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid #b9c0ba;border-radius:8px;font-size:16px;background:#fff}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
button.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:16px;cursor:pointer}
button.btn:hover{filter:brightness(1.08)}button.btn.sec{background:#fff;color:var(--ink);border:1px solid #b9c0ba}
button.btn.bad{background:var(--bad)}button.btn.sm{padding:7px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.eq{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.eq b{font-size:17px}.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:13px}
.msg{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:16px}.ok{background:#e3f4ea;color:#0a5c3d;border:1px solid #b7e0c8}
.err{background:#fdeceb;color:var(--bad);border:1px solid #f3c2bf}.info{background:#eef3f8;color:#24425e;border:1px solid #cddbe8}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;background:var(--ac);color:#fff;padding:9px}td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
.bar{height:12px;background:var(--ac);border-radius:6px;min-width:2px}.s-confirmed{color:#0a5c3d}.s-cancelled{color:var(--bad)}.s-no-show{color:var(--warn)}.s-completed{color:var(--mut)}
#dblog{max-width:980px;margin:0 auto 40px;padding:0 20px}#dblog details{background:#14202b;color:#e9f1ec;border-radius:12px;padding:12px 16px}
#dblog summary{cursor:pointer;font-weight:600}#dblog .ent{border-top:1px solid #ffffff22;margin-top:10px;padding-top:8px;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap}
#dblog .a{color:#7fe0b8;font-family:system-ui,sans-serif;font-size:14px}.muted{color:var(--mut)}small{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>AITU Smart Gym</h1>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>
<div id="dblog"><details open><summary>Database activity (what the interface sent to Supabase)</summary><div id="logbody"><small>No actions yet.</small></div></details></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== SETUP: paste your Supabase anon (public) key here ======
const SUPABASE_URL = 'https://ycsfaoybznkhgzpclacc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FFW-31ZSq4zTYT2aYckmWw_pcmVfe3e';
// ===============================================================

const app = document.getElementById('app');
let sb = null, user = null, pending = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const tomorrow = () => { const d = new Date(); d.setDate(d.getDate()+1); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const addMin = (t, m) => { const [h,mi] = t.split(':').map(Number); const x = h*60+mi+m; return pad(Math.floor(x/60))+':'+pad(x%60); };
const nowStamp = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };

function log(action, sql, result){
  const box = document.getElementById('logbody');
  if (box.querySelector('small')) box.innerHTML = '';
  const d = document.createElement('div'); d.className = 'ent';
  d.innerHTML = '<span class="a">' + esc(action) + '</span>\n' + esc(sql) + '\n-> ' + esc(result);
  box.prepend(d);
}
function banner(kind, text){ return '<div class="msg ' + kind + '">' + esc(text) + '</div>'; }
function setNav(active){
  const items = [];
  if (user && user.role === 'student') items.push(['find','Find equipment'],['mine','My bookings'],['stats','Statistics']);
  if (user && user.role === 'staff') items.push(['stats','Statistics'],['admin','Manage equipment']);
  document.getElementById('nav').innerHTML = items.map(i => '<button class="' + (i[0]===active?'on':'') + '" data-go="' + i[0] + '">' + i[1] + '</button>').join('') + (user ? '<button data-go="out">Log out</button>' : '');
  document.getElementById('who').textContent = user ? ((user.role==='staff'?'Staff: ':'Student: ') + user.name) : '';
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}
function go(s){
  if (s==='out'){ pending = null; return doLogout(); }
  ({find:showFind, mine:showMine, stats:showStats, admin:showAdmin})[s]();
}
async function run(promise){ const r = await promise; if (r.error) throw new Error(r.error.message); return r.data; }
async function runLogged(action, sql, promise){
  try{
    const data = await run(promise);
    log(action, sql, data.length + ' row(s)');
    return data;
  }catch(e){
    log(action, sql, 'ERROR: ' + e.message);
    throw e;
  }
}

// ---------- Screen 1: Login ----------
function showLogin(msg){
  setNav('');
  app.innerHTML = '<div class="card"><h2>Welcome</h2><p class="muted">Sign in with your university e-mail. We will send you a secure sign-in link.</p>' + (msg||'') +
    '<div class="row"><div><label for="em">University e-mail</label><input id="em" type="email" placeholder="a.sarsen@astanait.edu.kz"></div></div>' +
    '<button class="btn" id="lg">Send sign-in link</button> <small>Students and staff use the same form.</small></div>';
  document.getElementById('lg').onclick = doLogin;
  document.getElementById('em').onkeydown = e => { if (e.key==='Enter') doLogin(); };
}
async function doLogin(){
  const email = document.getElementById('em').value.trim().toLowerCase();
  if (!email) return showLogin(banner('err','Please enter your e-mail.'));
  const action = 'Auth: Send sign-in link';
  const request = 'POST /auth/v1/otp (email and redirect URL redacted)';
  log(action, request, 'Sending request...');
  try{
    const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo:window.location.href.split('#')[0]}});
    if (error) throw error;
    log(action, request, 'Request accepted; check the inbox.');
    showLogin(banner('ok','Check your e-mail for the secure sign-in link.'));
  }catch(e){
    log(action, request, 'ERROR: ' + e.message);
    showLogin(banner('err','Sign-in error: ' + e.message));
  }
}
async function loadUser(session){
  const email = session.user.email.toLowerCase();
  const students = await runLogged('Auth: Find active student profile',
    "SELECT student_id, name, surname FROM student WHERE email = [authenticated user] AND account_status = 'active' LIMIT 1;",
    sb.from('student').select('student_id,name,surname').eq('email', email).eq('account_status','active').limit(1));
  if (students.length){
    const s = students[0];
    user = {role:'student', id:s.student_id, name:s.name+' '+(s.surname||'')};
    return showFind(banner('ok','Welcome, ' + s.name + '!'));
  }
  const staff = await runLogged('Auth: Find active staff profile',
    "SELECT staff_id, full_name, role FROM staff WHERE email = [authenticated user] AND account_status = 'active' LIMIT 1;",
    sb.from('staff').select('staff_id,full_name,role').eq('email', email).eq('account_status','active').limit(1));
  if (staff.length){
    user = {role:'staff', id:staff[0].staff_id, name:staff[0].full_name};
    return showAdmin(banner('ok','Welcome, ' + staff[0].full_name + '!'));
  }
  await sb.auth.signOut();
  showLogin(banner('err','No active student or staff account was found for this e-mail.'));
}
async function doLogout(){
  try{
    await run(sb.auth.signOut());
    user = null;
    showLogin();
  }catch(e){ app.insertAdjacentHTML('afterbegin',banner('err','Sign-out error: ' + e.message)); }
}

// ---------- Screen 2: Find equipment ----------
async function showFind(msg){
  setNav('find');
  let zones = [];
  try{
    zones = await runLogged('Screen: Load gym zones',
      'SELECT zone_id, zone_name FROM gym_zone ORDER BY zone_id;',
      sb.from('gym_zone').select('zone_id,zone_name').order('zone_id'));
  }catch(e){ msg = (msg||'') + banner('err','Database error: ' + e.message); }
  const times = []; for (let m=8*60; m<=21*60+30; m+=30) times.push(pad(Math.floor(m/60))+':'+pad(m%60));
  app.innerHTML = '<div class="card"><h2>Find equipment</h2>' + (msg||'') +
   '<div class="row">' +
   '<div><label for="zn">Gym zone</label><select id="zn"><option value="">All zones</option>' + zones.map(z => '<option value="'+z.zone_id+'">'+esc(z.zone_name)+'</option>').join('') + '</select></div>' +
   '<div><label for="ty">Equipment type</label><select id="ty"><option value="">All types</option><option value="cardio">Cardio</option><option value="strength">Strength</option><option value="free_weights">Free weights</option><option value="functional">Functional</option></select></div>' +
   '<div><label for="dt">Date</label><input id="dt" type="date" value="' + tomorrow() + '"></div>' +
   '<div><label for="st">Start time</label><select id="st">' + times.map(t => '<option>'+t+'</option>').join('') + '</select></div>' +
   '<div><label for="du">Session length</label><select id="du"><option value="15">15 min</option><option value="20">20 min</option><option value="30" selected>30 min</option></select></div>' +
   '</div><button class="btn" id="fd">Find equipment</button></div><div id="res"></div>';
  document.getElementById('fd').onclick = findEquipment;
}
async function findEquipment(){
  const zone = document.getElementById('zn').value, type = document.getElementById('ty').value;
  const date = document.getElementById('dt').value, start = document.getElementById('st').value, dur = Number(document.getElementById('du').value);
  const end = addMin(start, dur), res = document.getElementById('res');
  if (!date) return res.innerHTML = banner('err','Please choose a date.');
  res.innerHTML = banner('info','Searching...');
  try{
    const busy = await run(sb.from('booking').select('equipment_id').eq('booking_date', date).eq('status','confirmed').lt('start_time', end).gt('end_time', start));
    const ids = [...new Set(busy.map(b => b.equipment_id))];
    let q = sb.from('equipment').select('equipment_id,name,equipment_type,max_session_min,gym_zone(zone_name)').eq('status','available');
    if (zone) q = q.eq('zone_id', Number(zone));
    if (type) q = q.eq('equipment_type', type);
    if (ids.length) q = q.not('equipment_id','in','(' + ids.join(',') + ')');
    let rows = await run(q.order('equipment_id'));
    rows = rows.filter(r => Number(r.max_session_min) >= dur);
    log('Button: Find equipment',
      "SELECT e.equipment_id, e.name, e.equipment_type, e.max_session_min, z.zone_name\nFROM equipment e JOIN gym_zone z ON z.zone_id = e.zone_id\nWHERE e.status = 'available'" + (zone?"\n  AND e.zone_id = "+zone:'') + (type?"\n  AND e.equipment_type = '"+type+"'":'') +
      (ids.length?"\n  AND e.equipment_id NOT IN ("+ids.join(',')+")  -- already booked "+start+"-"+end:'') + ';',
      rows.length + ' machine(s) returned');
    if (!rows.length) return res.innerHTML = banner('info','No equipment is available for these filters. Try another time.');
    res.innerHTML = '<h2>Search results (' + rows.length + ')</h2><div class="grid">' + rows.map(r =>
      '<div class="eq"><b>' + esc(r.name) + '</b><span class="tag">' + esc(r.gym_zone ? r.gym_zone.zone_name : '') + '</span><small>' + esc(r.equipment_type) + ' | max ' + esc(r.max_session_min) + ' min</small>' +
      '<small>' + esc(date) + ', ' + start + '-' + end + '</small><button class="btn sm" data-b="' + r.equipment_id + '">Book</button></div>').join('') + '</div>';
    res.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
      const r = rows.find(x => x.equipment_id === Number(b.dataset.b));
      pending = {equipment_id:r.equipment_id, name:r.name, zone:r.gym_zone?r.gym_zone.zone_name:'', date, start, end};
      showConfirm();
    });
  }catch(e){ res.innerHTML = banner('err','Database error: ' + e.message); }
}

// ---------- Screen 3: Confirm booking ----------
function showConfirm(){
  setNav('find');
  const p = pending;
  app.innerHTML = '<div class="card"><h2>Confirm booking</h2><table><tr><th>Equipment</th><td>' + esc(p.name) + '</td></tr><tr><th>Zone</th><td>' + esc(p.zone) + '</td></tr><tr><th>Date</th><td>' + esc(p.date) + '</td></tr><tr><th>Time</th><td>' + p.start + ' - ' + p.end + '</td></tr></table><br>' +
   '<button class="btn" id="cf">Confirm Booking</button> <button class="btn sec" id="bk">Back to search</button></div>';
  document.getElementById('bk').onclick = () => showFind();
  document.getElementById('cf').onclick = confirmBooking;
}
async function confirmBooking(){
  const p = pending, btn = document.getElementById('cf'); btn.disabled = true;
  try{
    // re-check that the slot is still free
    const clash = await run(sb.from('booking').select('booking_id').eq('equipment_id', p.equipment_id).eq('booking_date', p.date).eq('status','confirmed').lt('start_time', p.end).gt('end_time', p.start));
    if (clash.length){ btn.disabled = false; return showFind(banner('err','Sorry, this slot was just booked by someone else.')); }
    const row = {student_id:user.id, equipment_id:p.equipment_id, booking_date:p.date, start_time:p.start, end_time:p.end, status:'confirmed', created_at:nowStamp()};
    const inserted = await run(sb.from('booking').insert(row).select('booking_id').single());
    const id = Number(inserted.booking_id);
    log('Button: Confirm Booking',
      "INSERT INTO booking (student_id, equipment_id, booking_date, start_time, end_time, status, created_at)\nVALUES (" + user.id + ", " + p.equipment_id + ", '" + p.date + "', '" + p.start + "', '" + p.end + "', 'confirmed', '" + row.created_at + "');",
      '1 row inserted (booking_id = ' + id + ')');
    pending = null;
    showMine(banner('ok','Booking Confirmed! Your booking number is ' + id + '.'));
  }catch(e){ btn.disabled = false; app.insertAdjacentHTML('afterbegin', banner('err','Database error: ' + e.message)); }
}

// ---------- Screen 4: My bookings ----------
async function showMine(msg){
  setNav('mine');
  app.innerHTML = '<div class="card"><h2>My bookings</h2>' + (msg||'') + '<div id="ml">Loading...</div></div>';
  try{
    const rows = await run(sb.from('booking').select('booking_id,booking_date,start_time,end_time,status,equipment(name)').eq('student_id', user.id).order('booking_date').order('start_time'));
    log('Screen: My bookings', "SELECT b.booking_id, e.name, b.booking_date, b.start_time, b.end_time, b.status\nFROM booking b JOIN equipment e ON e.equipment_id = b.equipment_id\nWHERE b.student_id = " + user.id + "\nORDER BY b.booking_date, b.start_time;", rows.length + ' row(s)');
    const ml = document.getElementById('ml');
    if (!rows.length) return ml.innerHTML = '<p class="muted">You have no bookings yet. Use "Find equipment" to make one.</p>';
    ml.innerHTML = '<table><tr><th>#</th><th>Equipment</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr>' + rows.map(r =>
      '<tr><td>' + r.booking_id + '</td><td>' + esc(r.equipment ? r.equipment.name : '') + '</td><td>' + esc(r.booking_date) + '</td><td>' + esc(r.start_time) + '-' + esc(r.end_time) + '</td><td class="s-' + esc(r.status) + '">' + esc(r.status) + '</td><td>' +
      (r.status==='confirmed' ? '<button class="btn sm bad" data-c="' + r.booking_id + '">Cancel</button>' : '') +
      (r.status==='cancelled' ? '<button class="btn sm sec" data-d="' + r.booking_id + '">Remove</button>' : '') + '</td></tr>').join('') + '</table>';
    ml.querySelectorAll('[data-c]').forEach(b => b.onclick = () => cancelBooking(Number(b.dataset.c)));
    ml.querySelectorAll('[data-d]').forEach(b => b.onclick = () => removeBooking(Number(b.dataset.d)));
  }catch(e){ document.getElementById('ml').innerHTML = banner('err','Database error: ' + e.message); }
}
async function cancelBooking(id){
  if (!confirm('Cancel booking #' + id + '?')) return;
  try{
    const rows = await run(sb.from('booking').update({status:'cancelled'}).eq('booking_id', id).eq('student_id', user.id).eq('status','confirmed').select());
    log('Button: Cancel', "UPDATE booking SET status = 'cancelled'\nWHERE booking_id = " + id + " AND student_id = " + user.id + " AND status = 'confirmed';", rows.length + ' row(s) updated');
    showMine(banner('ok','Booking #' + id + ' was cancelled.'));
  }catch(e){ showMine(banner('err','Database error: ' + e.message)); }
}
async function removeBooking(id){
  if (!confirm('Remove cancelled booking #' + id + ' permanently?')) return;
  try{
    const rows = await run(sb.from('booking').delete().eq('booking_id', id).eq('student_id', user.id).eq('status','cancelled').select());
    log('Button: Remove', "DELETE FROM booking\nWHERE booking_id = " + id + " AND student_id = " + user.id + " AND status = 'cancelled';", rows.length + ' row(s) deleted');
    showMine(banner('ok','Booking #' + id + ' was removed.'));
  }catch(e){ showMine(banner('err','Database error: ' + e.message)); }
}

// ---------- Screen 5: Statistics (aggregation) ----------
async function showStats(){
  setNav('stats');
  app.innerHTML = '<div class="card"><h2>Gym statistics</h2><div id="st1">Loading...</div></div>';
  try{
    const [zones, status, usage] = await Promise.all([run(sb.rpc('bookings_per_zone')), run(sb.rpc('bookings_by_status')), run(sb.rpc('sensor_usage'))]);
    log('Screen: Statistics (zones)', "SELECT z.zone_name, COUNT(*) AS total_bookings\nFROM booking b JOIN equipment e ON e.equipment_id = b.equipment_id\nJOIN gym_zone z ON z.zone_id = e.zone_id\nWHERE b.status <> 'cancelled'\nGROUP BY z.zone_name ORDER BY total_bookings DESC;", zones.length + ' group(s)');
    log('Screen: Statistics (status)', "SELECT status, COUNT(*) AS total FROM booking GROUP BY status ORDER BY total DESC;", status.length + ' group(s)');
    log('Screen: Statistics (sensors)', "SELECT e.name, COUNT(*) AS readings, ROUND(100.0 * SUM(CASE WHEN sr.occupancy_status = 'in_use' THEN 1 ELSE 0 END) / COUNT(*), 0) AS in_use_percent\nFROM sensor_reading sr JOIN equipment_sensor es ON es.sensor_id = sr.sensor_id JOIN equipment e ON e.equipment_id = es.equipment_id\nGROUP BY e.name;", usage.length + ' machine(s)');
    const mx = Math.max(1, ...zones.map(z => Number(z.total_bookings)));
    document.getElementById('st1').innerHTML =
      '<h3>Bookings per zone (without cancelled)</h3><table><tr><th>Zone</th><th>Bookings</th><th></th></tr>' + zones.map(z => '<tr><td>' + esc(z.zone_name) + '</td><td>' + z.total_bookings + '</td><td style="width:40%"><div class="bar" style="width:' + (100*Number(z.total_bookings)/mx) + '%"></div></td></tr>').join('') + '</table>' +
      '<h3>Bookings by status</h3><table><tr><th>Status</th><th>Total</th></tr>' + status.map(s => '<tr><td class="s-' + esc(s.status_name) + '">' + esc(s.status_name) + '</td><td>' + s.total + '</td></tr>').join('') + '</table>' +
      '<h3>Smart feature: machine use according to sensors</h3><table><tr><th>Machine</th><th>Readings</th><th>In use, %</th></tr>' + usage.map(u => '<tr><td>' + esc(u.equipment_name) + '</td><td>' + u.readings + '</td><td>' + u.in_use_percent + '</td></tr>').join('') + '</table>' +
      '<p><small>Sensor data in this demo is synthetic.</small></p>';
  }catch(e){ document.getElementById('st1').innerHTML = banner('err','Database error: ' + e.message + ' (did you run gym_07_app_setup.sql?)'); }
}

// ---------- Screen 6: Staff - manage equipment (UPDATE) ----------
async function showAdmin(msg){
  setNav('admin');
  app.innerHTML = '<div class="card"><h2>Manage equipment</h2>' + (msg||'') + '<div id="al">Loading...</div></div>';
  try{
    const rows = await run(sb.from('equipment').select('equipment_id,name,status,updated_by,gym_zone(zone_name)').order('equipment_id'));
    log('Screen: Manage equipment', "SELECT e.equipment_id, e.name, e.status, e.updated_by, z.zone_name\nFROM equipment e JOIN gym_zone z ON z.zone_id = e.zone_id ORDER BY e.equipment_id;", rows.length + ' row(s)');
    const opts = v => ['available','maintenance','out_of_service'].map(o => '<option' + (o===v?' selected':'') + '>' + o + '</option>').join('');
    document.getElementById('al').innerHTML = '<table><tr><th>#</th><th>Machine</th><th>Zone</th><th>Status</th><th>Last edited by (staff id)</th><th></th></tr>' + rows.map(r =>
      '<tr><td>' + r.equipment_id + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.gym_zone ? r.gym_zone.zone_name : '') + '</td><td><select id="s' + r.equipment_id + '">' + opts(r.status) + '</select></td><td>' + esc(r.updated_by) + '</td><td><button class="btn sm" data-u="' + r.equipment_id + '">Save</button></td></tr>').join('') + '</table>';
    document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => setStatus(Number(b.dataset.u)));
  }catch(e){ document.getElementById('al').innerHTML = banner('err','Database error: ' + e.message); }
}
async function setStatus(id){
  const v = document.getElementById('s'+id).value;
  try{
    const rows = await run(sb.from('equipment').update({status:v, updated_by:user.id}).eq('equipment_id', id).select());
    log('Button: Save (staff)', "UPDATE equipment SET status = '" + v + "', updated_by = " + user.id + "\nWHERE equipment_id = " + id + ";", rows.length + ' row(s) updated');
    showAdmin(banner('ok','Equipment #' + id + ' is now "' + v + '".'));
  }catch(e){ showAdmin(banner('err','Database error: ' + e.message)); }
}

// ---------- start ----------
if (!window.supabase || SUPABASE_KEY.startsWith('PASTE')){
  app.innerHTML = '<div class="card"><h2>Setup needed</h2><p>Open <b>index.html</b> in a text editor and paste your Supabase anon key into <code>SUPABASE_KEY</code> (Supabase: Project Settings, API Keys). Also run <code>gym_07_app_setup.sql</code> once in the SQL Editor.</p></div>';
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.getSession().then(({data,error}) => {
    if (error) throw error;
    if (data.session) return loadUser(data.session);
    showLogin();
  }).catch(e => showLogin(banner('err','Authentication error: ' + e.message)));
}
</script>
